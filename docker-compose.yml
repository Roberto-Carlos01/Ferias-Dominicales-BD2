version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: bdferias_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-bdferias}
      MYSQL_USER: ${DB_USERNAME:-feriauser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-feriapass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/insercion_mysql.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./database/insert_usuario.sql:/docker-entrypoint-initdb.d/03_usuarios.sql:ro
    networks:
      - ferias_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local

networks:
  ferias_network:
    driver: bridge
